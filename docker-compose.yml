version: "3"

services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./:/project
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - 8000:80
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    networks:
      - backend
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
