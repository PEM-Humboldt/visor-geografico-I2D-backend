server {
  listen 80;
  server_name localhost;

  location /static/ {
    alias /app/static/;
  }

  location /media/ {
    alias /app/media/;
  }

  location / {
      proxy_pass http://web:8001;
      proxy_connect_timeout 360s;
      proxy_read_timeout 360s;
      proxy_send_timeout 360s;
  }

  location = /favicon.ico {
      access_log off;
      log_not_found off;
  }
}
